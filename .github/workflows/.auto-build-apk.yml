name: Auto Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Auto-Detect and Extract Zip or Subfolder Project
    - name: Auto-Detect Project Files
      run: |
        # Zip file check
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE"
        fi

        # Find project folder with build.gradle / settings.gradle
        BUILD_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJ_DIR=$(dirname "$BUILD_FILE")
          if [ "$PROJ_DIR" != "." ]; then
            echo "Found project in subfolder: $PROJ_DIR. Moving files to root..."
            cp -rn "$PROJ_DIR"/* . || true
          fi
        fi

    # 2. Auto-Fix Missing Google Services File
    - name: Auto-Fix Missing Google Services File
      run: |
        mkdir -p app
        if [ ! -f "app/google-services.json" ]; then
          echo "Creating dummy google-services.json to fix build..."
          echo '{
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.example.app" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

    # 3. Setup Gradle Properties & Wrapper
    - name: Setup Gradle Properties and Wrapper
      run: |
        echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> gradle.properties
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper missing, generating..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
