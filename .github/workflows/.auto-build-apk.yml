name: Auto Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Automate fix for missing google-services.json
    - name: Auto-Fix Missing Google Services File
      run: |
        mkdir -p app
        if [ ! -f "app/google-services.json" ]; then
          echo "Creating dummy google-services.json to fix build..."
          echo '{
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.example.app" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy" }],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

    # 2. Automate fix for KSP / Headless AWT Crash
    - name: Setup Gradle Properties
      run: |
        echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 3. Build the APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
