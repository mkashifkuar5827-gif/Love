name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Agar aap zip file extract karte hain, to unzip step yahan rakhin
      # - name: Unzip Project
      #   run: unzip -q kashif-mobile-\&-repair.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # UPDATED STEP: Smart Search & Auto-Fix
      - name: Auto Fix Duplicate Icon Resources
        run: |
          echo "Searching for res folder and cleaning duplicate launcher icons..."
          
          # Pooray repository mein jahan bhi ic_launcher ki webp/png files hain unhein delete kar dega
          find . -type f \( -path "*/res/*/ic_launcher*.webp" -o -path "*/res/*/ic_launcher*.png" \) -delete || true
          
          echo "Duplicate icons cleanup complete!"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
