name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. JAVA
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 4. SHOW REPOSITORY
      # ---------------------------------------------------------
      - name: Show repository files
        shell: bash
        run: |
          echo "Repository files:"
          find . \
            -path './.git' -prune -o \
            -type f -print \
            | sort

      # ---------------------------------------------------------
      # 5. PREPARE ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Preparing Android project..."

          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/test/java
          mkdir -p app/src/androidTest/java

          # -----------------------------------------------------
          # AndroidManifest
          # -----------------------------------------------------

          if [ -f "AndroidManifest.xml" ]; then
            cp "AndroidManifest.xml" \
              "app/src/main/AndroidManifest.xml"
          fi

          # -----------------------------------------------------
          # Kotlin source files
          # -----------------------------------------------------

          find . -maxdepth 1 -type f -name "*.kt" -print0 | while IFS= read -r -d '' FILE
          do
            PACKAGE=$(grep -m1 '^package ' "$FILE" \
              | sed 's/^package //' \
              | tr -d '\r')

            if [ -n "$PACKAGE" ]; then
              PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
              DEST="app/src/main/java/$PACKAGE_PATH"

              mkdir -p "$DEST"
              cp "$FILE" "$DEST/"

              echo "Copied $FILE -> $DEST/"
            else
              cp "$FILE" app/src/main/java/
              echo "Copied package-less Kotlin file: $FILE"
            fi
          done

          # -----------------------------------------------------
          # Test Kotlin files
          # -----------------------------------------------------

          find . -maxdepth 1 -type f \
            \( -name "*Test.kt" -o -name "*Tests.kt" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            PACKAGE=$(grep -m1 '^package ' "$FILE" \
              | sed 's/^package //' \
              | tr -d '\r')

            if [ -n "$PACKAGE" ]; then
              PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
              DEST="app/src/test/java/$PACKAGE_PATH"

              mkdir -p "$DEST"
              cp "$FILE" "$DEST/"
            else
              cp "$FILE" app/src/test/java/
            fi
          done

          # -----------------------------------------------------
          # Values resources
          # -----------------------------------------------------

          for FILE in strings.xml colors.xml themes.xml
          do
            if [ -f "$FILE" ]; then
              cp "$FILE" "app/src/main/res/values/$FILE"
            fi
          done

          # -----------------------------------------------------
          # XML resources
          # -----------------------------------------------------

          for FILE in *.xml
          do
            [ -f "$FILE" ] || continue

            case "$FILE" in
              AndroidManifest.xml)
                ;;

              strings.xml|colors.xml|themes.xml)
                ;;

              backup_rules.xml|data_extraction_rules.xml)
                cp "$FILE" app/src/main/res/xml/
                ;;

              ic_launcher*.xml)
                cp "$FILE" app/src/main/res/drawable/
                ;;

              *)
                echo "XML resource detected: $FILE"
                ;;
            esac
          done

          # -----------------------------------------------------
          # Image resources
          # -----------------------------------------------------

          find . -maxdepth 1 -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
            \) \
            -exec cp {} app/src/main/res/drawable/ \;

          # -----------------------------------------------------
          # Normalize Android resource filenames
          # -----------------------------------------------------

          find app/src/main/res -type f | while read FILE
          do
            DIR=$(dirname "$FILE")
            NAME=$(basename "$FILE")

            LOWER=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
            LOWER=$(echo "$LOWER" | sed 's/[^a-z0-9_.-]/_/g')

            if [ "$NAME" != "$LOWER" ]; then
              mv "$FILE" "$DIR/$LOWER"
            fi
          done

          echo ""
          echo "Prepared Android project:"
          find app -maxdepth 8 -type f | sort

      # ---------------------------------------------------------
      # 6. DETECT PACKAGE
      # ---------------------------------------------------------
      - name: Detect application package
        shell: bash
        run: |
          set -e

          PACKAGE=$(find app/src/main/java \
            -type f \
            -name "*.kt" \
            -exec grep -h -m1 '^package ' {} \; \
            | head -n 1 \
            | sed 's/^package //' \
            | tr -d '\r')

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Kotlin package could not be detected."
            exit 1
          fi

          echo "Detected application package:"
          echo "$PACKAGE"

          echo "APP_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 7. CREATE MANIFEST IF NECESSARY
      # ---------------------------------------------------------
      - name: Prepare Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then

            echo "AndroidManifest.xml not found."

            MAIN_ACTIVITY=$(find app/src/main/java \
              -type f \
              -name "MainActivity.kt" \
              | head -n 1)

            if [ -z "$MAIN_ACTIVITY" ]; then
              echo "ERROR: MainActivity.kt not found."
              exit 1
            fi

            cat > "$MANIFEST" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Love"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.App">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          fi

          echo "Manifest:"
          cat "$MANIFEST"

      # ---------------------------------------------------------
      # 8. CREATE BASIC THEME IF MISSING
      # ---------------------------------------------------------
      - name: Prepare basic Android resources
        shell: bash
        run: |
          set -e

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then

            cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.App"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

          fi

      # ---------------------------------------------------------
      # 9. CREATE APP GRADLE
      # ---------------------------------------------------------
      - name: Generate app build.gradle.kts
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.kapt")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = System.getenv("APP_PACKAGE") ?: "com.example.love"

              compileSdk = 36

              defaultConfig {
                  applicationId = System.getenv("APP_PACKAGE") ?: "com.example.love"

                  minSdk = 24
                  targetSdk = 36

                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {

              implementation(platform(
                  "androidx.compose:compose-bom:2024.09.03"
              ))

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")

              implementation("androidx.activity:activity-compose:1.9.2")

              implementation(
                  "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
              )

              implementation(
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
              )

              implementation(
                  "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
              )

              implementation(
                  "androidx.navigation:navigation-compose:2.8.2"
              )

              implementation(
                  "androidx.compose.material:material-icons-extended"
              )

              implementation(
                  "androidx.room:room-runtime:2.6.1"
              )

              implementation(
                  "androidx.room:room-ktx:2.6.1"
              )

              kapt(
                  "androidx.room:room-compiler:2.6.1"
              )

              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
              )

              debugImplementation(
                  "androidx.compose.ui:ui-tooling"
              )

              debugImplementation(
                  "androidx.compose.ui:ui-test-manifest"
              )

              testImplementation("junit:junit:4.13.2")
          }
          EOF

      # ---------------------------------------------------------
      # 10. ROOT GRADLE
      # ---------------------------------------------------------
      - name: Generate root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false

              id("org.jetbrains.kotlin.android") version "2.0.21" apply false

              id("org.jetbrains.kotlin.kapt") version "2.0.21" apply false

              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

      # ---------------------------------------------------------
      # 11. SETTINGS GRADLE
      # ---------------------------------------------------------
      - name: Generate settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Love"

          include(":app")
          EOF

      # ---------------------------------------------------------
      # 12. GRADLE PROPERTIES
      # ---------------------------------------------------------
      - name: Generate gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          kotlin.code.style=official

          android.nonTransitiveRClass=false
          EOF

      # ---------------------------------------------------------
      # 13. SETUP GRADLE 8.9
      # ---------------------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------------------------------------------------------
      # 14. GRADLE VERSION
      # ---------------------------------------------------------
      - name: Check Gradle
        run: |
          gradle --version

      # ---------------------------------------------------------
      # 15. GRADLE PROJECT CHECK
      # ---------------------------------------------------------
      - name: Validate Gradle project
        run: |
          gradle projects \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 16. CLEAN
      # ---------------------------------------------------------
      - name: Clean project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 17. BUILD APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 18. FIND APK
      # ---------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          echo "APK files generated:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------------
      # 19. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 20. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KASHIF-MOBILE-REPAIR-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 21. FINAL MESSAGE
      # ---------------------------------------------------------
      - name: Build completed
        run: |
          echo "======================================"
          echo "       ANDROID BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: $APK_PATH"
          echo "Artifact: KASHIF-MOBILE-REPAIR-APK"
          echo "======================================"
