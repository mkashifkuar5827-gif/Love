name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # Check repository root first
          if [ -f "settings.gradle.kts" ] && [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            # Search for settings.gradle.kts
            SETTINGS_FILE=$(find . \
              -type f \
              -name "settings.gradle.kts" \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app Gradle file not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Show project structure
        shell: bash
        run: |
          echo "Project structure:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            -not -path "*/.gradle/*" \
            | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files generated:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KASHIF-MOBILE-REPAIR-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
