name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # NAYA STEP: Duplicate Launcher Icons ko Auto Delete Karne Ke Liye
      - name: Auto Fix Duplicate Icon Resources
        run: |
          echo "Checking for duplicate launcher icons..."
          
          # Agar .xml files mojood hain to extra .webp ya .png delete ho jaye gi
          find app/src/main/res/ -name "ic_launcher*.webp" -exec rm -f {} +
          find app/src/main/res/ -name "ic_launcher*.png" -exec rm -f {} +
          
          echo "Duplicate files removed successfully!"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
