name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Preparing Android project..."

          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Move AndroidManifest.xml
          if [ -f "AndroidManifest.xml" ]; then
            cp "AndroidManifest.xml" \
              "app/src/main/AndroidManifest.xml"
          fi

          # Move Kotlin source files according to their package declaration
          find . -maxdepth 1 -type f -name "*.kt" | while read FILE; do
            PACKAGE=$(grep -m1 '^package ' "$FILE" | sed 's/^package //' | tr -d '\r')

            if [ -n "$PACKAGE" ]; then
              PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
              DEST="app/src/main/java/$PACKAGE_PATH"
              mkdir -p "$DEST"
              cp "$FILE" "$DEST/"
              echo "Kotlin: $FILE -> $DEST/"
            else
              cp "$FILE" app/src/main/java/
              echo "Kotlin without package: $FILE"
            fi
          done

          # Move test Kotlin files
          mkdir -p app/src/test/java

          find . -maxdepth 1 -type f \
            \( -name "*Test.kt" -o -name "*Tests.kt" \) | while read FILE; do

            PACKAGE=$(grep -m1 '^package ' "$FILE" | sed 's/^package //' | tr -d '\r')

            if [ -n "$PACKAGE" ]; then
              PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
              DEST="app/src/test/java/$PACKAGE_PATH"
              mkdir -p "$DEST"
              cp "$FILE" "$DEST/"
            else
              cp "$FILE" app/src/test/java/
            fi
          done

          # Copy values XML files
          for FILE in strings.xml colors.xml themes.xml; do
            if [ -f "$FILE" ]; then
              cp "$FILE" "app/src/main/res/values/$FILE"
            fi
          done

          # Copy XML drawable/resource files
          for FILE in *.xml; do
            [ -f "$FILE" ] || continue

            case "$FILE" in
              AndroidManifest.xml|strings.xml|colors.xml|themes.xml)
                ;;
              backup_rules.xml|data_extraction_rules.xml)
                cp "$FILE" app/src/main/res/xml/ 2>/dev/null || {
                  mkdir -p app/src/main/res/xml
                  cp "$FILE" app/src/main/res/xml/
                }
                ;;
              ic_launcher*.xml)
                mkdir -p app/src/main/res/drawable
                cp "$FILE" app/src/main/res/drawable/
                ;;
            esac
          done

          # Copy image assets
          find . -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            -exec cp {} app/src/main/res/drawable/ \;

          # Fix invalid Android resource names
          find app/src/main/res -type f | while read FILE; do
            DIR=$(dirname "$FILE")
            NAME=$(basename "$FILE")
            LOWER=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
            LOWER=$(echo "$LOWER" | sed 's/[^a-z0-9_.-]/_/g')

            if [ "$NAME" != "$LOWER" ]; then
              mv "$FILE" "$DIR/$LOWER"
            fi
          done

          echo "Prepared project structure:"
          find app -maxdepth 6 -type f | sort

      - name: Detect application package
        shell: bash
        run: |
          set -e

          PACKAGE=$(find app/src/main/java -type f -name "*.kt" \
            -exec grep -h -m1 '^package ' {} \; \
            | head -n1 \
            | sed 's/^package //' \
            | tr -d '\r')

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Could not detect Kotlin package."
            exit 1
          fi

          echo "Detected package: $PACKAGE"
          echo "APP_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Generate application Gradle file
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = System.getenv("APP_PACKAGE") ?: "com.example.app"
              compileSdk = 36

              defaultConfig {
                  applicationId = System.getenv("APP_PACKAGE") ?: "com.example.app"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")

              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              kapt("androidx.room:room-compiler:2.6.1")

              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")

              testImplementation("junit:junit:4.13.2")
          }
          EOF

      - name: Enable Kotlin KAPT
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android")',
              'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.kapt")'
          )

          p.write_text(text)
          PY

      - name: Create settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Love"
          include(":app")
          EOF

      - name: Create root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.kapt") version "2.0.21" apply false
          }
          EOF

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Validate Gradle project
        run: |
          gradle --version
          gradle projects --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KASHIF-MOBILE-REPAIR-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
