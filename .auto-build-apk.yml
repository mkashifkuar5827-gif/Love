name: Auto Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-build:
    name: Detect Project, Fix Build & Create APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and extract ZIP project if present
        shell: bash
        run: |
          set -e
          mkdir -p _source

          ZIP="$(find . -maxdepth 3 -type f \( -iname '*.zip' \) \
            ! -path './.git/*' ! -path './_source/*' | head -n 1 || true)"

          if [ -n "$ZIP" ]; then
            echo "ZIP found: $ZIP"
            unzip -q "$ZIP" -d _source
          else
            echo "No ZIP found. Using repository files."
            cp -R . _source/project 2>/dev/null || true
          fi

          echo "Searching for Android project..."
          ROOT="$(find _source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            ROOT="$(find _source -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: No Android/Gradle project was found in the ZIP/repository."
            find _source -maxdepth 4 -type f | head -200
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $ROOT"
          find "$ROOT" -maxdepth 2 -type f | sort | head -200

      - name: Inspect Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          echo "===== Project files ====="
          find . -maxdepth 3 -type f \
            ! -path './.gradle/*' \
            ! -path './build/*' | sort | head -300

          echo "===== Gradle files ====="
          ls -la
          find . -maxdepth 2 -type f \( \
            -name 'gradlew' -o \
            -name 'gradle-wrapper.properties' -o \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' \) -print

      - name: Install/use Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using project's Gradle wrapper."
          else
            echo "No Gradle wrapper found. Installing Gradle 9.3.1."
            sudo apt-get update -qq
            sudo apt-get install -y unzip
            wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            sudo unzip -q gradle-9.3.1-bin.zip -d /opt
            sudo ln -sf /opt/gradle-9.3.1/bin/gradle /usr/local/bin/gradle
          fi

      - name: Auto detect Android SDK requirements
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          echo "Detecting compileSdk/targetSdk..."
          grep -RhoE 'compileSdk(V?ersion)?[[:space:]]*[=:][[:space:]]*[0-9]+' \
            --include='*.gradle' --include='*.gradle.kts' . 2>/dev/null | head -20 || true

          # Install a broad set of common SDK platforms/build-tools.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "build-tools;36.0.0" || true

      - name: Generate debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Auto build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            CMD="./gradlew"
          else
            CMD="gradle"
          fi

          echo "===== Running Gradle tasks ====="
          "$CMD" tasks --all --no-daemon --stacktrace | tee "$GITHUB_WORKSPACE/gradle-tasks.txt"

          echo "===== Building Debug APK ====="
          "$CMD" assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-build-cache \
            -Dorg.gradle.configuration-cache=false \
            -Dkotlin.incremental=false \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "===== Searching for APK ====="
          find "$PROJECT_ROOT" -type f -name '*.apk' -print

          APK="$(find "$PROJECT_ROOT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            APK="$(find "$PROJECT_ROOT" -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but no APK was generated."
            echo "===== Last build output ====="
            tail -n 200 "$GITHUB_WORKSPACE/build.log" || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/KASHIF-MOBILE-AND-REPAIR.apk"
          echo "APK=$APK"
          ls -lh "$GITHUB_WORKSPACE/release/KASHIF-MOBILE-AND-REPAIR.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KASHIF-MOBILE-AND-REPAIR-APK
          path: release/KASHIF-MOBILE-AND-REPAIR.apk
          if-no-files-found: error

      - name: Upload build logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: |
            build.log
            gradle-tasks.txt
          if-no-files-found: ignore
